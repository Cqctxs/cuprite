[package]
name = "cuprite-memory"
version.workspace = true
edition.workspace = true
publish.workspace = true
description = "Scoped CPU/GPU memory ownership for Cuprite"

[features]
default = []
cuda = ["dep:cudarc"]

[dependencies]
cudarc = { workspace = true, optional = true }

[dev-dependencies]
# Multicore CPU baseline for the residency benchmark.
rayon = "=1.12.0"
# Randomized GPU-versus-CPU comparison tests.
proptest = { version = "=1.11.0", default-features = false, features = ["std"] }
