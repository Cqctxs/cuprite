[package]
name = "cuprite-probes"
description = "Ordinary Rust functions used to study what the Cuprite driver sees"
version.workspace = true
edition.workspace = true
publish.workspace = true

[dependencies]
# Probe for library-provided parallel iteration.
rayon = "=1.12.0"
# Vector math from another author, for calls into generic library code.
# `scalar-math` makes `Vec3A` plain data, which `sdfu` builds on.
glam = { version = "=0.34.3", features = ["scalar-math"] }
# Signed distance fields from another author: scenes built before a loop.
sdfu = { version = "=0.3.1-alpha.1", features = ["glam"] }
# Held out: vector math by a third author, used to validate calls only after
# they were built on `glam`.
ultraviolet = "=0.9.2"
# Held out for reading data: colour math by a fourth author, used only
# after values before the loop, parameters and inputs were built.
palette = { version = "=0.7.7", default-features = false, features = ["std"] }
# Held out for checks: division by run-time divisors and integer helpers by
# two more authors, used only after the error flag was built.
strength_reduce = "=0.2.4"
num-integer = "=0.1.47"
# Held out for maps, calls, closures and checks: half-precision floats and a
# pure-Rust math library, by two more authors, used only after closures and
# `for_each` were built.
half = "=2.7.1"
libm = "=0.2.16"
# Development code for the grid structure: procedural noise, whose
# generators the grid measurement (`measure/`) ported.
noise = "=0.9.0"
