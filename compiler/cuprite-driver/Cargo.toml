[package]
name = "cuprite-driver"
description = "rustc driver that rewrites GPU candidates, and `cargo cuprite`, which builds packages with it"
version.workspace = true
edition.workspace = true
publish.workspace = true

[package.metadata.rust-analyzer]
# Lets rust-analyzer resolve `extern crate rustc_*`.
rustc_private = true

[features]
# Declares an NVIDIA GPU test host: the GPU-path tests run and must pass.
gpu-tests = []

[dependencies]
# Reads Cargo's JSON output: `cargo cuprite` and the tests use it to locate
# the runtime's artifacts and the target directory.
serde_json = "=1.0.140"
