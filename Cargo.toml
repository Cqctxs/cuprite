[workspace]
members = ["crates/cuprite-memory"]
# Its own workspace, on a pinned nightly.
exclude = ["compiler"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
publish = false

[workspace.dependencies]
cudarc = { version = "=0.19.10", default-features = false, features = ["std", "driver", "nvrtc", "dynamic-loading", "cuda-12080"] }
